# Every push to main (a merged PR) builds a signed APK, runs the unit tests and publishes it
# as a GitHub Release, tagged v1.0.<commit count> (the stable line; 0.3.x before 2026-11-16). Run it by hand from the Actions tab too.
#
# Needs four repository secrets (Settings › Secrets and variables › Actions):
#   DIACRITICA_KEYSTORE_BASE64   the release keystore (.jks), base64-encoded
#   DIACRITICA_KEYSTORE_PASSWORD
#   DIACRITICA_KEY_ALIAS
#   DIACRITICA_KEY_PASSWORD
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version number is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DIACRITICA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The DIACRITICA_KEYSTORE_BASE64 secret is missing. See the comment at the top of release.yml."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "DIACRITICA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests and release APK
        env:
          DIACRITICA_KEYSTORE_PASSWORD: ${{ secrets.DIACRITICA_KEYSTORE_PASSWORD }}
          DIACRITICA_KEY_ALIAS: ${{ secrets.DIACRITICA_KEY_ALIAS }}
          DIACRITICA_KEY_PASSWORD: ${{ secrets.DIACRITICA_KEY_PASSWORD }}
        run: ./gradlew --stacktrace testDebugUnitTest assembleRelease

      - name: Check the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "certificate DN"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "CN=Android Debug" && { echo "::error::Signed with the debug key"; exit 1; } || true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep in step with versionName in app/build.gradle.kts. The last number must keep growing (the updater compares it).
          VERSION="1.0.$(git rev-list --count HEAD)"
          APK="diacritica-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            # Re-run on the same commit: replace the files.
            gh release upload "v$VERSION" "$APK" "$APK.sha256" --clobber
            exit 0
          fi
          gh release create "v$VERSION" "$APK" "$APK.sha256" \
            --target "$GITHUB_SHA" \
            --title "Diacritica $VERSION" \
            --generate-notes \
            --latest
          echo "Published v$VERSION: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
